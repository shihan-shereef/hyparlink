      // Before the first paint: the theme the toggle saved, else light (owner: src/utils/studioTheme.ts).

        if (JSON.parse(localStorage.getItem("hf-studio-ui-preferences") || "{}").theme !== "dark")
          document.documentElement.dataset.theme = "paper";
      } catch (e) {
        document.documentElement.dataset.theme = "paper";
      }
    </script>
