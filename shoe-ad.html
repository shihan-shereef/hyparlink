<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
==========================================================================================
  STRIDE  -  "NO SHOES? NO SPEED."   27-second cinematic shoe ad   (1920x1080)
  Pure HTML + CSS + SVG shapes. No images. No libraries needed.

  HOW TO EDIT
   * Colours ........ the :root block at the top of <style>  (--ray-shirt, --shoe-glow, --sky-top ...)
   * Words .......... the <div id="cap1..4">, the speech bubbles and the END CARD in <body>
   * Timing ......... every text/effect has  style="--start:Xs;--dur:Ys"  (start second + length)
   * Characters ..... each pose is its own commented <g id="ray-..."> / <g id="max-..."> block
   * Camera/scroll .. @keyframes cam, par*, maxmove (bottom of <style>) - each row shows its second
   * Total length = 27s.  In the baked tracks, percentage = seconds / 27 * 100.
==========================================================================================
-->
<meta name="viewport" content="width=1920, height=1080">
<title>Stride X1 - Shoe Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. COLOURS & FONTS  -  change these to restyle the whole ad
   ============================================================ */
:root{
  --font:"Poppins","Arial Black",Impact,sans-serif;
  --accent:#ffd23f;            /* highlighted words in captions */

  /* sky + scenery */
  --sky-top:#3f86d6; --sky-mid:#ffc999; --sky-low:#ffe6c4; --sun:#fff3cf;
  --hill-far:#8db4c8; --hill-mid:#6f9e84;
  --trunk:#5a3a28; --leaf1:#3d7a48; --leaf2:#2f6a3d;
  --grass-top:#6fae52; --grass-low:#2f7234;
  --road:#3a3e49; --curb:#cfd4de; --road-dash:#f4e4a4; --post:#394150;

  /* Ray (the runner) */
  --ray-skin:#f1c7a0; --ray-shirt:#ff5533; --ray-shorts:#243049; --ray-hair:#1b1b1f;
  /* Max (the friend) */
  --max-skin:#8c5a3c; --max-shirt:#2d7ff0; --max-shorts:#1c2430; --max-hair:#15151a; --max-hat:#f2c230;

  /* the shoes + the box */
  --shoe:#b8ff3d; --shoe-2:#14171f; --shoe-glow:#c8ff4d;
  --box:#ff7a1a; --box-dark:#14171f;
  --mood:#2a5a92;              /* cold tint while Ray is hurt */
}

/* ============================================================
   2. PAGE + LAYOUT
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:var(--font)}
section.clip{position:absolute;left:0;top:0;width:1920px;height:1080px}
#scene{position:absolute;left:0;top:0}
#camera{transform-origin:960px 540px;animation:cam 27s linear both}
#root > section > div{pointer-events:none}

/* parallax layers: each one scrolls at a fraction of the world speed (see baked tracks at the bottom) */
.par{animation-duration:27s;animation-timing-function:linear;animation-fill-mode:both}
.par005{animation-name:par005}.par008{animation-name:par008}.par02{animation-name:par02}
.par045{animation-name:par045}.par07{animation-name:par07}.par10{animation-name:par10}.par15{animation-name:par15}
.maxmove{animation:maxmove 27s linear both}

/* ============================================================
   3. SCENERY COLOURS
   ============================================================ */
.cloud{fill:#fff;opacity:.88}
.hill-far{fill:var(--hill-far)} .hill-mid{fill:var(--hill-mid)}
.trunk{fill:var(--trunk)} .leaf1{fill:var(--leaf1)} .leaf2{fill:var(--leaf2)}
.dash{fill:var(--road-dash)} .speck{fill:rgba(255,255,255,.1)}
.blade{fill:#4f9a43} .post{fill:var(--post)} .lamp{fill:#fff1b8}
.bokeh{fill:rgba(255,236,170,.55)}
.stone{fill:#8a8f99} .stone-hi{stroke:#c3c8d2;stroke-width:5;stroke-linecap:round}
.shadow{fill:#000;opacity:.28}

/* ============================================================
   4. CHARACTERS  (colours come from the variables above)
   ============================================================ */
.ray{--skin:var(--ray-skin);--shirt:var(--ray-shirt);--shorts:var(--ray-shorts);--hair:var(--ray-hair)}
.max{--skin:var(--max-skin);--shirt:var(--max-shirt);--shorts:var(--max-shorts);--hair:var(--max-hair)}
.skin{fill:var(--skin)} .shirt{fill:var(--shirt)} .shorts{fill:var(--shorts)} .hair{fill:var(--hair)}
.shirt-acc{stroke:rgba(255,255,255,.75);stroke-width:7;stroke-linecap:round}
.hat{fill:var(--max-hat)} .hat2{fill:#d9a91c}
.ln{fill:none;stroke:#1a1a22;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.ln2{fill:none;stroke:#1a1a22;stroke-width:3}
.nose,.toe{fill:none;stroke:rgba(0,0,0,.28);stroke-width:3;stroke-linecap:round}
.blister{fill:#e0453c;opacity:.9}
.sweat{fill:#8fdcff;animation:drip .8s ease-in infinite}
.sweat.s2{animation-delay:-.4s}
.ache path{fill:none;stroke:#ff3b30;stroke-width:6;stroke-linecap:round}
.ache{animation:ache .45s ease-in-out infinite alternate}

/* shoes */
.shoe-sole{fill:#fff} .shoe-up{fill:var(--shoe)} .shoe-tip{fill:var(--shoe-2)}
.shoe-swoosh{stroke:var(--shoe-2);stroke-width:7;stroke-linecap:round}
.shoe-lace{stroke:#fff;stroke-width:4;stroke-linecap:round}
.shoe-glow{animation:glow 1s ease-in-out infinite alternate}
/* shoe box */
.box-base{fill:var(--box)} .box-lid{fill:var(--box-dark)}
.box-txt{font:900 22px var(--font);letter-spacing:.12em;fill:#fff}

/* ---- pose switching: a pose is only visible between --start and --start+--dur ---- */
.pose-seq{opacity:0;animation:vis var(--dur) linear var(--start)}
@keyframes vis{from,to{opacity:1}}

/* ---- run / jog cycle (leg + arm swing driven by variables set on each pose) ---- */
.cyc .thigh{animation:thigh var(--T) ease-in-out infinite}
.cyc .shin{animation:shin var(--T) ease-in-out infinite}
.cyc .foot{animation:footc var(--T) ease-in-out infinite}
.cyc .leg.b .thigh,.cyc .leg.b .shin,.cyc .leg.b .foot{animation-delay:calc(var(--T) / -2)}
.cyc .uarm{animation:uarm var(--T) ease-in-out infinite}
.cyc .arm.f .uarm{animation-delay:calc(var(--T) / -2)}
.cyc .farm{transform:rotate(calc(var(--el) * 1deg))}
.cyc .bob{animation:bob calc(var(--T) / 2) ease-in-out infinite}
.static-arms .uarm,.static-arms .arm.f .uarm,.static-arms .arm.b .uarm{animation:none!important}
.wave .arm.f .uarm{animation:wave1 .5s ease-in-out infinite}
.wave .arm.f .farm{animation:wave2 .5s ease-in-out infinite}
@keyframes thigh{0%,100%{transform:rotate(calc(var(--tf) * 1deg))}50%{transform:rotate(calc(var(--tb) * 1deg))}}
@keyframes shin{0%{transform:rotate(calc(var(--kf) * 1deg))}30%{transform:rotate(calc(var(--kf) * .6deg))}
  55%{transform:rotate(calc(var(--kb) * 1deg))}78%{transform:rotate(calc(var(--kp) * 1deg))}100%{transform:rotate(calc(var(--kf) * 1deg))}}
@keyframes footc{0%{transform:rotate(-4deg)}30%{transform:rotate(0deg)}55%{transform:rotate(24deg)}78%{transform:rotate(8deg)}100%{transform:rotate(-4deg)}}
@keyframes uarm{0%,100%{transform:rotate(calc(var(--uf) * 1deg))}50%{transform:rotate(calc(var(--ub) * 1deg))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wave1{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-122deg)}}
@keyframes wave2{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(26deg)}}
@keyframes drip{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(34px)}}
@keyframes ache{from{opacity:.25}to{opacity:1}}
@keyframes glow{from{opacity:.45}to{opacity:1}}

/* ---- Ray trips on the stone and slides  (5.7s) ---- */
.fall{animation:fall 1.3s linear var(--start) forwards}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0deg);animation-timing-function:ease-in}
  18%{transform:translate(40px,0) rotate(30deg);animation-timing-function:ease-in}
  40%{transform:translate(200px,0) rotate(82deg);animation-timing-function:ease-out}
  52%{transform:translate(214px,-10px) rotate(74deg);animation-timing-function:ease-in}
  66%{transform:translate(234px,-14px) rotate(83deg);animation-timing-function:ease-out}
  100%{transform:translate(240px,-26px) rotate(82deg)}
}
/* ---- Ray drifts forward on screen while sprinting ---- */
.runmove{animation:runmove var(--dur) ease-in-out var(--start) both}
@keyframes runmove{from{transform:translateX(0)}to{transform:translateX(190px)}}

/* ---- dust, sparkles, shoe box ---- */
.puff,.dust{transform-box:fill-box;transform-origin:center}
.puff{fill:#eadfc8;animation:puff 1.1s ease-out var(--start) both}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.3)}12%{opacity:.85}100%{opacity:0;transform:translate(calc(var(--dx) * 1px),-70px) scale(1.8)}}
.dust{fill:#e6d9bd;animation:dustl .46s ease-out infinite}
@keyframes dustl{0%{opacity:.75;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(-170px,-26px) scale(1.7)}}
.streak{fill:var(--shoe-glow);transform-box:fill-box;transform-origin:100% 50%;animation:streak .23s linear infinite}
@keyframes streak{0%{opacity:.85;transform:scaleX(.15)}100%{opacity:0;transform:scaleX(1) translateX(-60px)}}
.burst path,.spk path{fill:#fff7b0;stroke:var(--shoe-glow);stroke-width:3}
.burst{animation:burst .9s ease-out var(--start) both}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(0)}15%{opacity:1;transform:translate(0,0) scale(1.4)}
  100%{opacity:0;transform:translate(calc(var(--dx) * 1px),calc(var(--dy) * 1px)) scale(.3) rotate(120deg)}}
.spk{animation:spk var(--dur) ease-in-out var(--start) both}
@keyframes spk{0%{opacity:0;transform:translate(var(--x,0),var(--y,0)) scale(0)}50%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(0) rotate(90deg)}}
.lid{animation:lid .45s ease-out var(--start) forwards}
@keyframes lid{from{transform:rotate(0deg)}to{transform:rotate(-112deg)}}
.shoes-pop{animation:shoespop 1s cubic-bezier(.2,1.3,.4,1) var(--start) both}
@keyframes shoespop{0%{opacity:0;transform:translate(0,20px) scale(.3)}100%{opacity:1;transform:translate(0,-110px) scale(1.9) rotate(-6deg)}}
.shoes-fly{animation:shoesfly .35s ease-in var(--start) forwards}
@keyframes shoesfly{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(-113px,117px) scale(.3)}}

/* ============================================================
   5. TEXT, BUBBLES, OVERLAYS   (each has --start and --dur)
   ============================================================ */
div.cap{position:absolute;left:0;top:140px;width:1920px;padding:0 120px;text-align:center;font:900 78px/1.08 var(--font);
  color:#fff;letter-spacing:.01em;text-shadow:0 8px 34px rgba(0,0,0,.55);opacity:0;
  animation:capIn var(--dur) cubic-bezier(.2,.7,.2,1) var(--start) both}
div.cap em{font-style:normal;color:var(--accent)}
@keyframes capIn{0%{opacity:0;transform:translateY(46px);letter-spacing:.16em;filter:blur(10px)}
  14%{opacity:1;transform:none;letter-spacing:.01em;filter:none}86%{opacity:1;transform:none;filter:none}
  100%{opacity:0;transform:translateY(-24px);filter:blur(6px)}}

.bubble{position:absolute;padding:20px 32px 22px;background:#fff;color:#161a22;font:700 44px/1.18 var(--font);border-radius:34px;
  box-shadow:0 16px 44px rgba(0,0,0,.38);opacity:0;transform-origin:var(--tail) 100%;animation:pop var(--dur) ease-out var(--start) both}
.bubble.ray{border:7px solid var(--ray-shirt)} .bubble.max{border:7px solid var(--max-shirt)}
.bubble .who{display:block;font-size:20px;letter-spacing:.24em;margin-bottom:6px}
.bubble.ray .who{color:var(--ray-shirt)} .bubble.max .who{color:var(--max-shirt)}
.bubble::after{content:"";position:absolute;bottom:-34px;left:var(--tail);border-left:18px solid transparent;border-right:18px solid transparent;border-top:36px solid #fff}
@keyframes pop{0%{opacity:0;transform:scale(.4) translateY(30px)}12%{opacity:1;transform:scale(1.07)}18%{transform:scale(1)}
  88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.92) translateY(-12px)}}

#ouch{position:absolute;width:500px;height:500px;background:#ffd23f;clip-path:polygon(50.0% 0.0%,57.3% 17.8%,71.7% 5.0%,70.6% 24.2%,89.1% 18.8%,79.7% 35.7%,98.7% 38.9%,83.0% 50.0%,98.7% 61.1%,79.7% 64.3%,89.1% 81.2%,70.6% 75.8%,71.7% 95.0%,57.3% 82.2%,50.0% 100.0%,42.7% 82.2%,28.3% 95.0%,29.4% 75.8%,10.9% 81.2%,20.3% 64.3%,1.3% 61.1%,17.0% 50.0%,1.3% 38.9%,20.3% 35.7%,10.9% 18.8%,29.4% 24.2%,28.3% 5.0%,42.7% 17.8%);opacity:0;animation:ouch var(--dur) ease-out var(--start) both}
#ouch .ouch-in{position:absolute;inset:34px;background:#ff2d2d;clip-path:polygon(50.0% 0.0%,57.3% 17.8%,71.7% 5.0%,70.6% 24.2%,89.1% 18.8%,79.7% 35.7%,98.7% 38.9%,83.0% 50.0%,98.7% 61.1%,79.7% 64.3%,89.1% 81.2%,70.6% 75.8%,71.7% 95.0%,57.3% 82.2%,50.0% 100.0%,42.7% 82.2%,28.3% 95.0%,29.4% 75.8%,10.9% 81.2%,20.3% 64.3%,1.3% 61.1%,17.0% 50.0%,1.3% 38.9%,20.3% 35.7%,10.9% 18.8%,29.4% 24.2%,28.3% 5.0%,42.7% 17.8%);display:grid;place-items:center}
#ouch span{font:900 104px var(--font);color:#fff;transform:rotate(-8deg);text-shadow:0 6px 0 rgba(0,0,0,.25)}
@keyframes ouch{0%{opacity:0;transform:scale(0) rotate(-25deg)}14%{opacity:1;transform:scale(1.18) rotate(6deg)}24%{transform:scale(1) rotate(-3deg)}
  84%{opacity:1;transform:scale(1) rotate(-3deg)}100%{opacity:0;transform:scale(.8) rotate(-3deg)}}

#speedlines{position:absolute;inset:0;overflow:hidden;opacity:0;animation:envl var(--dur) linear var(--start)}
#speedlines i{position:absolute;left:0;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85));
  transform:translateX(2100px);animation:sl linear infinite}
@keyframes sl{from{transform:translateX(2100px)}to{transform:translateX(-900px)}}
@keyframes envl{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}

.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .55s ease-out var(--start)}
.flash.small{animation:flashS .3s ease-out var(--start)}
@keyframes flash{0%{opacity:0}12%{opacity:.9}100%{opacity:0}}
@keyframes flashS{0%{opacity:0}10%{opacity:.5}100%{opacity:0}}

#mood{position:absolute;inset:0;background:var(--mood);opacity:0;animation:mood 27s linear both}
#grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,170,90,.2),rgba(30,60,120,.2));mix-blend-mode:soft-light}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.6) 100%)}
#brandtag{position:absolute;left:96px;top:128px;font:800 26px var(--font);letter-spacing:.38em;color:#fff;opacity:.8;text-shadow:0 2px 12px rgba(0,0,0,.5)}

/* ---- end card ---- */
#end{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 38%,#18344f 0%,#0a121c 62%,#05080d 100%);
  animation:endIn var(--dur) linear var(--start) forwards}
@keyframes endIn{0%{opacity:0}9%{opacity:1}100%{opacity:1}}
#end-shoe{overflow:visible;position:absolute;left:560px;top:118px;filter:drop-shadow(0 34px 40px rgba(0,0,0,.6))}
#end-shoe .float{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(-3deg)}}
#end-title{position:absolute;left:0;top:540px;width:1920px;margin:0;text-align:center;font:900 132px/1 var(--font);letter-spacing:.06em;color:#fff;
  animation:titleIn .9s cubic-bezier(.2,.9,.2,1) var(--start) both}
#end-title .x1{color:var(--shoe)}
#end-tag{position:absolute;left:0;top:706px;width:1920px;margin:0;text-align:center;font:600 44px var(--font);letter-spacing:.22em;color:#dfe8f2;
  animation:fadeUp .8s ease-out var(--start) both}
#end-tag em{font-style:normal;color:var(--shoe)}
#end-cta{position:absolute;left:660px;top:808px;width:600px;padding:18px 0;text-align:center;font:800 32px var(--font);letter-spacing:.08em;
  color:#14171f;background:var(--shoe);border-radius:60px;animation:fadeUp .8s ease-out var(--start) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes titleIn{from{opacity:0;transform:scale(1.5);letter-spacing:.3em}to{opacity:1;transform:none}}

/* ---- cinematic bars + fades ---- */
.bar{position:absolute;left:0;width:1920px;height:110px;background:#000}
.bar.top{top:0;animation:bar 1.6s cubic-bezier(.7,0,.2,1) both}
.bar.bot{bottom:0;animation:bar 1.6s cubic-bezier(.7,0,.2,1) both}
@keyframes bar{from{height:540px}to{height:110px}}
#fadein{position:absolute;inset:0;background:#000;animation:fin 1.1s ease-out both}
@keyframes fin{from{opacity:1}to{opacity:0}}
#fadeout{position:absolute;inset:0;background:#000;opacity:0;animation:fout .8s ease-in 26.2s both}
@keyframes fout{from{opacity:0}to{opacity:1}}
